# ── napari-hub configuration ───────────────────────────────────────────
# This file customises how the plugin is displayed on https://napari-hub.org
# All keys are optional; anything you omit will fall back to the values
# taken from your package metadata (pyproject.toml / setup.cfg / setup.py).
# See the hub wiki for the full spec:
# https://github.com/chanzuckerberg/napari-hub/wiki/napari-hub-Plugin-Configuration#configyml

# ─ Basic identity ─────────────────────────────────────────────────────
display_name: TUM.ai Neurogenesis Toolkit
summary: |
  Automated nuclear segmentation and neural cell type classification for neurogenesis research.
  Supports Cellpose-based segmentation and VAE-powered classification of astrocytes, neurons, OPCs, and dead cells.
authors:
  - name: TUM.ai
    email: contact@tum-ai.com
    affiliation: Technical University of Munich

license: MIT              
development_status: Pre-Alpha 

categories:              
  - Segmentation
  - Image Classification
  - Filtering & Denoising
keywords:
  - cellpose
  - nuclei
  - neuroscience
  - neurogenesis
  - cell classification
  - neural cells
  - fluorescence microscopy
  - VAE
  - deep learning

readme: README.md
project_urls:
  Source Code: https://github.com/tum-ai/neurogenesis_napari
  Issue Tracker: https://github.com/tum-ai/neurogenesis_napari/issues
  Documentation: https://github.com/tum-ai/neurogenesis_napari
python_requires: ">=3.10"

# Upload a square PNG/SVG and reference it here to show a logo on the hub
# logo: assets/logo.png

works_with:
  - Linux
  - macOS
  - Windows
